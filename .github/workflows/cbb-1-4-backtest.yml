name: CBB 1.4 Offline Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run historical backtest
        run: python scripts/cbb_1_4_backtest.py --games research/cbb_1_3_2_games.csv --team-games research/cbb_1_3_2_team_games.csv --out generated/cbb_1_4
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-1-4-backtest
          path: generated/cbb_1_4/
