name: CBB Schedule Preview
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0,13 * * *'
permissions:
  contents: write
concurrency:
  group: cbb-gameday-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'melvinjamesjackson-blip/handicapper-cbb-test' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch today's and tomorrow's schedules
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from scripts.cbb_gameday import event_row, get_day, ratings

          central = ZoneInfo('America/Chicago')
          now = dt.datetime.now(central)
          prior_games = []
          prior_path = Path('research/cbb_1_3_2_games.csv')
          if prior_path.exists():
              with prior_path.open(encoding='utf-8-sig', newline='') as source:
                  for record in csv.DictReader(source):
                      if not ('2025-11-03' <= record['date'] <= '2026-04-06'):
                          continue
                      prior_games.append({
                          'completed': True,
                          'home_id': record['home'], 'away_id': record['away'],
                          'home': record['home_name'], 'away': record['away_name'],
                          'home_score': int(record['home_score']), 'away_score': int(record['away_score']),
                          'neutral': record['neutral'].strip().lower() in ('1', 'true'),
                      })
          prior, final_count = ratings(prior_games)
          slates = {}
          for day in (now.date(), now.date() + dt.timedelta(days=1)):
              board = get_day(day)
              if not isinstance(board.get('events'), list):
                  raise ValueError(f'Invalid scoreboard for {day}')
              games = {}
              for event in board['events']:
                  row = event_row(event)
                  if not row or not row['id']:
                      raise ValueError(f'Invalid matchup on scoreboard for {day}')
                  kick = dt.datetime.fromisoformat(event['date'].replace('Z', '+00:00')).astimezone(central)
                  status = event.get('status', {}).get('type', {})
                  competition = event['competitions'][0]
                  if kick.date() != day and competition.get('timeValid', True):
                      continue
                  row.update(
                      date=day.isoformat(),
                      tipoff_ct=kick.strftime('%I:%M %p CT').lstrip('0') if competition.get('timeValid', True) else 'Time TBD',
                      venue=(competition.get('venue') or {}).get('fullName', ''),
                      schedule_status=status.get('description', ''),
                      inactive=status.get('name') in ('STATUS_POSTPONED', 'STATUS_CANCELED', 'STATUS_CANCELLED'),
                  )
                  home = prior.get(row['home_id'])
                  away = prior.get(row['away_id'])
                  row['projection_available'] = bool(
                      not row['inactive'] and final_count >= 600
                      and home and away and min(home['games'], away['games']) >= 5
                  )
                  if row['projection_available']:
                      advantage = 0 if row['neutral'] else 1.5
                      hs = home['mean'] + home['off'] + away['defense_allowed'] + advantage
                      ass = away['mean'] + away['off'] + home['defense_allowed'] - advantage
                      row.update(
                          pred_home=round(hs, 1), pred_away=round(ass, 1),
                          home_margin=round(hs-ass, 1), total=round(hs+ass, 1),
                          home_prior_games=home['games'], away_prior_games=away['games'],
                          projection_source='Historical baseline',
                      )
                  else:
                      row['reason'] = 'Historical baseline unavailable: prior-season coverage required.'
                  games[row['id']] = row
              slates[day.isoformat()] = {'day': day.isoformat(), 'games': list(games.values())}
              print(f'{day}: {len(games)} matchups')
          output = Path('docs/cbb-schedule-preview.json')
          if output.exists():
              previous = json.loads(output.read_text())['slates']
              for day, slate in slates.items():
                  if not slate['games'] and previous.get(day, {}).get('games'):
                      raise ValueError(f'Refusing to replace an existing slate with an empty feed for {day}')
          output.write_text(json.dumps({'updated_at': now.isoformat(), 'slates': slates}, indent=2) + '\n')
          PY
      - name: Publish schedule
        run: |
          git add docs/cbb-schedule-preview.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m "Publish CBB schedule preview"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
