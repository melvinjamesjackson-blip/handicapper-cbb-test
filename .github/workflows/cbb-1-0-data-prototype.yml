name: CBB 1.0 Team Ratings Prototype (Test Only)
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start YYYY-MM-DD'
        required: true
        default: '2025-11-03'
      end_date:
        description: 'End YYYY-MM-DD'
        required: true
        default: '2025-11-09'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and rate college basketball results
        run: python scripts/cbb_1_0.py --start '${{ inputs.start_date }}' --end '${{ inputs.end_date }}' --out generated/cbb_1_0
      - name: Upload prototype data (no commits/deploys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-1-0-prototype
          path: generated/cbb_1_0/
          if-no-files-found: warn
