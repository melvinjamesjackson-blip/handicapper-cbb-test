<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sharp Handicapper · CBB Game Day</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf1fc;background:#0d1421}body{margin:0 auto;max-width:900px;padding:16px}h1{font-size:1.6rem}small,.sub{color:#a5b2c8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.input{border:1px solid #46546c;border-radius:8px;background:#1b283b;color:white;padding:12px;font-size:16px}button{background:#2b69cc;border:0;border-radius:8px;padding:12px 16px;color:white;font-weight:bold}.card{background:#172336;border:1px solid #34445c;border-radius:12px;padding:14px;margin:12px 0}.teams{font-size:1.13rem;font-weight:650}.stats{display:flex;gap:18px;margin:12px 0}.stat{flex:1}.stat b{display:block;font-size:1.3rem}.alert{background:#392b1d;border:1px solid #805d36;border-radius:8px;padding:12px}.ok{color:#82d9a5}.muted{color:#a5b2c8}#filter{width:100%;box-sizing:border-box}</style></head><body><h1>Sharp Handicapper · CBB Game Day</h1><p class="sub">Test-only · Opponent-aware historical scoring model · Not betting-calibrated</p><div class="controls"><label class="input">Open game-day report <input type="file" id="file" accept=".json,application/json"></label><button id="load">Load data.json</button></div><div id="info" class="alert">Load the <b>cbb_gameday.json</b> report downloaded from GitHub Actions, or copy it alongside this HTML as <b>data.json</b> and tap Load.</div><p><input class="input" id="filter" placeholder="Filter by team name"></p><div id="games"></div><script>const e=id=>document.getElementById(id);let data=null;function render(){const games=e('games');games.replaceChildren();if(!data)return;const val=e('filter').value.toLowerCase().trim();const shown=data.games.filter(g=>(g.home+' '+g.away).toLowerCase().includes(val));e('info').textContent=`${data.day} · ${data.matchups} matchups · ${data.projections_available} experimental projections · ${data.projections_blocked} blocked · ${data.prior_final_games} prior-season games`;for(const g of shown){let d=document.createElement('div');d.className='card';let title=document.createElement('div');title.className='teams';title.textContent=g.away+' @ '+g.home;d.append(title);let p=document.createElement('p');p.className='muted';p.textContent=g.tipoff_et+(g.neutral?' · Neutral site':'')+(g.completed?' · Game completed':'');d.append(p);if(g.projection_available){let s=document.createElement('div');s.className='stats';const items=[['Projected score',g.pred_away+'–'+g.pred_home],['Home margin',(g.home_margin>0?'+':'')+g.home_margin],['Total',g.total]];for(const [name,value] of items){let k=document.createElement('div');k.className='stat';let b=document.createElement('b');b.textContent=value;let sm=document.createElement('small');sm.textContent=name;k.append(b,sm);s.append(k)}d.append(s);let n=document.createElement('small');n.textContent='Historical baseline only; no validated betting edge';d.append(n)}else{let n=document.createElement('p');n.className='alert';n.textContent=g.reason;d.append(n)}games.append(d)}}e('filter').addEventListener('input',render);e('file').addEventListener('change',async ev=>{let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.games))throw Error('Expected games array');data=x;render()}catch(err){e('info').textContent='Could not read JSON: '+err.message}});e('load').addEventListener('click',async()=>{try{let r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw Error('data.json not found');data=await r.json();render()}catch(err){e('info').textContent=err.message+' — use Choose File instead.'}});</script></body></html>
